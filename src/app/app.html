@if(gameStarted){
<nz-layout class="app-layout">
  <nz-header>
    <div class="logo">
      <a>
        <img src="https://ng.ant.design/assets/img/logo.svg" alt="logo">
        <h1>牧場遊戲</h1>
      </a>
    </div>
    <ul nz-menu class="top-nav" nzTheme="dark" nzMode="horizontal">
      <li nz-menu-item routerLinkActive="ant-menu-item-selected" routerLink="/farm">農田</li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected" routerLink="/ranch">牧場</li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected" routerLink="/shop">商店</li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected" routerLink="/season-card">季節卡片</li>
    </ul>
  </nz-header>
  <nz-content>
    <div class="inner-content">
      <div class="inventory-header">
        <div class="stat">
          💰 <span>{{ getMoney() }}</span>
          ⏰ <span>{{ getTime() | date:'HH:mm:ss'}}</span>
        </div>
      </div>
      <nz-space>
        <app-inventory></app-inventory>
        <app-quest-board></app-quest-board>
      </nz-space>
      <router-outlet></router-outlet>
    </div>
  </nz-content>
</nz-layout>
}
@else {
  <div class="start-screen">
    <h1 class="title">牧場物語</h1>
      <button (click)="newGame()" class="button">開始新遊戲</button>
      <button (click)="continueGame()" class="button">繼續遊戲</button>
      <button (click)="clearGame()" class="button">清除遊戲</button>
      <button (click)="openSettings()" class="button">設定</button>
      <button (click)="openAbout()" class="button">關於</button>
  </div>
}
